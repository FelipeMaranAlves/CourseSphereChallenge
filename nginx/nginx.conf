events {
    worker_connections 1024;
}

http {
    # Round-robin load balancing across at least 2 backend instances
    upstream coursesphere_backend {
        server backend-1:5000 max_fails=3 fail_timeout=10s;
        server backend-2:5000 max_fails=3 fail_timeout=10s;
    }

    log_format loadbalancer '$remote_addr - [$time_local] "$request" '
                            'status=$status upstream=$upstream_addr '
                            'instance=$upstream_http_x_instance_id '
                            'request_time=${request_time}s';

    access_log /var/log/nginx/access.log loadbalancer;

    server {
        listen 5000;
        server_name _;

        # Hide nginx version for security hardening
        server_tokens off;

        location / {
            proxy_pass http://coursesphere_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;

            # Expose the backend instance header to clients/browsers
            add_header X-Load-Balanced-By "nginx-lb" always;
        }
    }
}

