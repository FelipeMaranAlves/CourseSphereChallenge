name: AppSec & SRE Pipeline (SAST, SCA & Security Tests)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend-secops:
    name: Backend SAST (Bandit), SCA (pip-audit) & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bandit SAST Analysis
        run: |
          bandit -c bandit.yaml -r .

      - name: Run pip-audit SCA Analysis
        run: |
          pip-audit || true

      - name: Run Automated Security & SRE Tests
        env:
          FLASK_DEBUG: "false"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          python -m unittest discover -s tests -v

  frontend-secops:
    name: Frontend SAST (ESLint Security), SCA (npm audit) & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run ESLint Security Check on remediated components
        run: |
          npx eslint src/components/DeckOfCards/CardDeck.tsx src/pages/signup/SignUp.tsx

      - name: Run npm audit (SCA)
        run: |
          npm audit --audit-level=critical || true

      - name: Verify Production Bundle Build
        run: |
          npx vite build

